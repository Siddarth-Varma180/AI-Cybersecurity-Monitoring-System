<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Adaptive IDS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <form method="post" class="card p-4 shadow" style="width:340px">
    <h4 class="mb-1">Adaptive IDS</h4>
    <p class="text-secondary small mb-3">Administrator sign-in</p>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <input class="form-control mb-2" name="username" placeholder="Username" autofocus required>
    <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
    <button class="btn btn-primary w-100">Sign in</button>
  </form>
</body>
</html>
