
<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Adaptive IDS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(rgba(0, 12, 30, 0.35),
                        rgba(0, 12, 30, 0.35)),
        url("/static/images/cybersecurity-bg.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .login-card {
      width: 340px;
      background: rgba(20, 35, 55, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 190, 255, 0.45);
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <form method="post" class="card login-card p-4 shadow-lg">

    <h4 class="mb-1">Adaptive IDS</h4>

    <p class="text-secondary small mb-3">
      Administrator sign-in
    </p>

    {% if error %}
      <div class="alert alert-danger py-2">
        {{ error }}
      </div>
    {% endif %}

    <input
      class="form-control mb-2"
      name="username"
      placeholder="Username"
      autofocus
      required
    >

    <input
      class="form-control mb-3"
      type="password"
      name="password"
      placeholder="Password"
      required
    >

    <button class="btn btn-primary w-100">
      Sign in
    </button>

  </form>

</body>
</html>
